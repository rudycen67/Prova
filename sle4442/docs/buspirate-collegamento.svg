<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Dove va la carta col Bus Pirate</text>
  <text x="30" y="55" font-size="13" fill="#555">Il Bus Pirate NON ha una fessura. La carta sta in un SOCKET, collegato ai pin con 5 fili.</text>

  <!-- BUS PIRATE -->
  <rect x="50" y="120" width="190" height="210" rx="10" fill="#e8edf2" stroke="#0072B2" stroke-width="2"/>
  <text x="145" y="150" font-size="15" font-weight="700" fill="#06365e" text-anchor="middle">Bus Pirate</text>
  <rect x="72" y="165" width="96" height="46" rx="4" fill="#111"/>
  <text x="120" y="193" font-size="10" fill="#8ad0a0" text-anchor="middle">schermo</text>
  <text x="145" y="315" font-size="11" fill="#555" text-anchor="middle">(USB al PC)</text>
  <!-- pin -->
  <circle cx="240" cy="170" r="4" fill="#b5760f"/><text x="232" y="174" font-size="10" fill="#333" text-anchor="end">VOUT</text>
  <circle cx="240" cy="200" r="4" fill="#111"/><text x="232" y="204" font-size="10" fill="#333" text-anchor="end">GND</text>
  <circle cx="240" cy="230" r="4" fill="#0072B2"/><text x="232" y="234" font-size="10" fill="#333" text-anchor="end">IO1 (CLK)</text>
  <circle cx="240" cy="260" r="4" fill="#0072B2"/><text x="232" y="264" font-size="10" fill="#333" text-anchor="end">IO0 (I/O)</text>
  <circle cx="240" cy="290" r="4" fill="#555"/><text x="232" y="294" font-size="10" fill="#333" text-anchor="end">IO2 (RST)</text>

  <!-- SOCKET -->
  <rect x="560" y="170" width="200" height="150" rx="8" fill="#eceae5" stroke="#555" stroke-width="2"/>
  <text x="660" y="305" font-size="13" font-weight="700" fill="#333" text-anchor="middle">Socket smart card</text>
  <!-- carta inserita -->
  <rect x="600" y="55" width="120" height="135" rx="9" fill="#f3f2ef" stroke="#444" stroke-width="2"/>
  <rect x="615" y="80" width="28" height="22" rx="3" fill="#d9b84a" stroke="#8a6d1c"/>
  <text x="675" y="95" font-size="12" font-weight="700" fill="#333">carta</text>
  <text x="675" y="111" font-size="12" font-weight="700" fill="#333">SLE4442</text>
  <!-- freccia "va qui" -->
  <line x1="790" y1="130" x2="724" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="792" y="134" font-size="12" font-weight="700" fill="#c0392b">la carta va QUI</text>
  <!-- socket pin -->
  <circle cx="560" cy="185" r="4" fill="#b5760f"/><text x="568" y="189" font-size="10" fill="#333">C1 VCC</text>
  <circle cx="560" cy="212" r="4" fill="#111"/><text x="568" y="216" font-size="10" fill="#333">C5 GND</text>
  <circle cx="560" cy="239" r="4" fill="#0072B2"/><text x="568" y="243" font-size="10" fill="#333">C3 CLK</text>
  <circle cx="560" cy="266" r="4" fill="#0072B2"/><text x="568" y="270" font-size="10" fill="#333">C7 I/O</text>
  <circle cx="560" cy="293" r="4" fill="#555"/><text x="568" y="297" font-size="10" fill="#333">C2 RST</text>

  <!-- FILI -->
  <line x1="240" y1="170" x2="560" y2="185" stroke="#b5760f" stroke-width="2"/>
  <line x1="240" y1="200" x2="560" y2="212" stroke="#111" stroke-width="2"/>
  <line x1="240" y1="230" x2="560" y2="239" stroke="#0072B2" stroke-width="2"/>
  <line x1="240" y1="260" x2="560" y2="266" stroke="#0072B2" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="240" y1="290" x2="560" y2="293" stroke="#555" stroke-width="2"/>
  <text x="400" y="168" font-size="10" fill="#8a5a0c" text-anchor="middle">alimentazione</text>
  <text x="400" y="203" font-size="10" fill="#111" text-anchor="middle">massa</text>
  <text x="400" y="228" font-size="10" fill="#06365e" text-anchor="middle">clock (pieno)</text>
  <text x="400" y="258" font-size="10" fill="#06365e" text-anchor="middle">dato (tratteggio)</text>
  <text x="400" y="288" font-size="10" fill="#333" text-anchor="middle">reset</text>

  <rect x="30" y="360" width="760" height="60" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="46" y="382" font-size="12" font-weight="700" fill="#1a1a1a">In parole:</text>
  <text x="46" y="402" font-size="12" fill="#333">La carta entra nel SOCKET. Il Bus Pirate si collega al socket con 5 fili (alimentazione, massa, clock, dato, reset). Poi, dal PC, gli dai i comandi.</text>
</svg>
