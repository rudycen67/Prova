<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="700" fill="#1a1a1a">Interfacciare la TUA carta con l'adattatore FPC (via il tuo ACR39U)</text>
  <text x="30" y="53" font-size="12" fill="#555">I pad X1 sono gli stessi contatti del lettore: ci colleghi la carta (socket) e l'analizzatore.</text>

  <!-- ACR39U -->
  <rect x="30" y="150" width="120" height="130" rx="10" fill="#eceae5" stroke="#555" stroke-width="2"/>
  <text x="90" y="210" font-size="12" font-weight="700" fill="#333" text-anchor="middle">ACR39U</text>
  <text x="90" y="226" font-size="10" fill="#555" text-anchor="middle">(USB al PC)</text>
  <rect x="146" y="195" width="12" height="40" fill="#333"/>

  <!-- adattatore FPC -->
  <rect x="150" y="185" width="230" height="60" rx="5" fill="#2a6b4f" stroke="#1c4733" stroke-width="2"/>
  <text x="265" y="263" font-size="11" fill="#1c4733" text-anchor="middle">adattatore FPC (linguetta nel lettore)</text>
  <!-- X1 pads -->
  <g font-size="9" fill="#fff">
    <rect x="250" y="192" width="15" height="11" rx="2" fill="#d9b84a"/><text x="268" y="201">VCC</text>
    <rect x="250" y="206" width="15" height="11" rx="2" fill="#d9b84a"/><text x="268" y="215">RST</text>
    <rect x="250" y="220" width="15" height="11" rx="2" fill="#d9b84a"/><text x="268" y="229">CLK</text>
    <rect x="320" y="192" width="15" height="11" rx="2" fill="#d9b84a"/><text x="338" y="201">GND</text>
    <rect x="320" y="206" width="15" height="11" rx="2" fill="#d9b84a"/><text x="338" y="215">VPP</text>
    <rect x="320" y="220" width="15" height="11" rx="2" fill="#d9b84a"/><text x="338" y="229">I/O</text>
  </g>
  <text x="300" y="178" font-size="10" fill="#1c4733" text-anchor="middle" font-weight="700">pad X1</text>

  <!-- socket con carta -->
  <rect x="470" y="280" width="150" height="110" rx="8" fill="#eceae5" stroke="#555" stroke-width="2"/>
  <text x="545" y="378" font-size="11" font-weight="700" fill="#333" text-anchor="middle">socket + la TUA SLE4442</text>
  <rect x="495" y="215" width="100" height="90" rx="7" fill="#f3f2ef" stroke="#444" stroke-width="2"/>
  <rect x="507" y="232" width="22" height="18" rx="3" fill="#d9b84a" stroke="#8a6d1c"/>
  <text x="560" y="250" font-size="10" font-weight="700" fill="#333">carta</text>
  <!-- wires X1 -> socket -->
  <line x1="335" y1="225" x2="470" y2="300" stroke="#8a6d1c" stroke-width="1.6"/>
  <line x1="335" y1="212" x2="470" y2="320" stroke="#111" stroke-width="1.6"/>
  <line x1="335" y1="198" x2="470" y2="340" stroke="#555" stroke-width="1.6"/>
  <text x="405" y="300" font-size="9" fill="#555" transform="rotate(14 405 300)">VCC/RST/CLK/GND/I/O</text>

  <!-- logic analyzer -->
  <rect x="470" y="110" width="170" height="70" rx="8" fill="#eaf3fb" stroke="#0072B2" stroke-width="2"/>
  <text x="555" y="140" font-size="12" font-weight="700" fill="#06365e" text-anchor="middle">Logic analyzer</text>
  <text x="555" y="158" font-size="11" fill="#0a4a7a" text-anchor="middle">+ PulseView (PC)</text>
  <line x1="265" y1="226" x2="480" y2="180" stroke="#0072B2" stroke-width="1.6"/>
  <line x1="335" y1="226" x2="500" y2="180" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="6 3"/>
  <line x1="335" y1="198" x2="520" y2="180" stroke="#111" stroke-width="1.6"/>
  <text x="400" y="196" font-size="9" fill="#06365e">CLK, I/O, GND</text>

  <rect x="30" y="400" width="820" height="34" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="44" y="421" font-size="12" fill="#333">L'ACR39U legge la tua carta ATTRAVERSO l'adattatore; la carta sta nel socket collegato ai pad X1; l'analizzatore ascolta CLK/I/O/GND.</text>
</svg>
