<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <!-- motivi di riempimento (distinguibili anche in bianco/nero) -->
    <pattern id="pPower" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fdeccf"/>
      <circle cx="4.5" cy="4.5" r="1.5" fill="#b5760f"/>
    </pattern>
    <pattern id="pGnd" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#eef2f6"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#111" stroke-width="1.4"/>
    </pattern>
    <pattern id="pUnused" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#efeee9"/>
      <path d="M0,9 L9,0" stroke="#b7b4ac" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="690" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a1a1a">Smart card SLE4442 — formato, posizione e dimensioni del chip</text>
  <text x="40" y="63" font-size="13" fill="#555">ISO/IEC 7810 ID-1 (carta) · ISO/IEC 7816-2 (contatti). Quote in mm. Colori + motivi + etichette (leggibile anche da daltonici).</text>

  <!-- ===== CARTA (sinistra), scala 5 px/mm ===== -->
  <rect x="50" y="110" width="428" height="270" rx="16" fill="#f3f2ef" stroke="#444" stroke-width="2"/>

  <!-- modulo chip, posizione ISO -->
  <rect x="93" y="201" width="64" height="82" rx="7" fill="#d9b84a" stroke="#8a6d1c" stroke-width="1.5"/>
  <line x1="125" y1="203" x2="125" y2="281" stroke="#8a6d1c" stroke-width="1"/>
  <line x1="95" y1="221" x2="155" y2="221" stroke="#8a6d1c" stroke-width="1"/>
  <line x1="95" y1="241" x2="155" y2="241" stroke="#8a6d1c" stroke-width="1"/>
  <line x1="95" y1="261" x2="155" y2="261" stroke="#8a6d1c" stroke-width="1"/>

  <line x1="157" y1="235" x2="520" y2="150" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- quota orizzontale (blu scuro, alto contrasto) -->
  <line x1="50" y1="185" x2="101" y2="185" stroke="#00407a" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="101" y1="185" x2="101" y2="201" stroke="#00407a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="75" y="179" font-size="12" fill="#00407a" text-anchor="middle" font-weight="700">10,25</text>

  <!-- quota verticale -->
  <line x1="74" y1="110" x2="74" y2="206" stroke="#00407a" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="74" y1="206" x2="93" y2="206" stroke="#00407a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="68" y="158" font-size="12" fill="#00407a" text-anchor="middle" font-weight="700" transform="rotate(-90 68 158)">19,23</text>

  <!-- quota larghezza / altezza -->
  <line x1="50" y1="398" x2="478" y2="398" stroke="#555" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="264" y="415" font-size="14" fill="#333" text-anchor="middle" font-weight="600">85,60 mm</text>
  <line x1="34" y1="110" x2="34" y2="380" stroke="#555" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="28" y="245" font-size="14" fill="#333" text-anchor="middle" font-weight="600" transform="rotate(-90 28 245)">53,98 mm</text>
  <text x="300" y="128" font-size="11" fill="#777">angoli r 3,18 mm</text>

  <rect x="50" y="428" width="428" height="9" rx="3" fill="#e2e0db" stroke="#9a978f" stroke-width="1"/>
  <text x="264" y="453" font-size="12" fill="#555" text-anchor="middle">spessore 0,76 mm (taglio, non in scala)</text>

  <!-- tabella quote ISO -->
  <rect x="50" y="472" width="430" height="196" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="66" y="494" font-size="13" font-weight="700" fill="#1a1a1a">Posizione contatti — ISO/IEC 7816-2</text>
  <text x="66" y="516" font-size="12" fill="#333">Area minima di ogni contatto: <tspan font-weight="700">2,0 × 1,7 mm</tspan></text>
  <text x="66" y="538" font-size="12" fill="#333" font-weight="700">Colonne (dal bordo SINISTRO):</text>
  <text x="80" y="556" font-size="12" fill="#333">C1–C4 (sinistra):  da 10,25 a 12,25 mm</text>
  <text x="80" y="573" font-size="12" fill="#333">C5–C8 (destra):    da 17,87 a 19,87 mm</text>
  <text x="66" y="595" font-size="12" fill="#333" font-weight="700">Righe (dal bordo SUPERIORE), lato alto:</text>
  <text x="80" y="613" font-size="12" fill="#333">C1/C5: 19,23   ·   C2/C6: 23,47</text>
  <text x="80" y="630" font-size="12" fill="#333">C3/C7: 27,71   ·   C4/C8: 31,95   (passo 4,24)</text>
  <text x="66" y="654" font-size="11" fill="#777">Modulo dorato visibile ~12–13 mm (non fissato da ISO).</text>

  <!-- ===== DETTAGLIO CONTATTI (destra) ===== -->
  <text x="545" y="96" font-size="14" fill="#333" font-weight="600">Contatti (lato chip verso di te)</text>

  <!-- C1 VCC (alimentazione: puntini, bordo arancio) -->
  <rect x="545" y="106" width="150" height="56" rx="8" fill="url(#pPower)" stroke="#b5760f" stroke-width="3"/>
  <rect x="637" y="112" width="52" height="15" rx="4" fill="#b5760f"/>
  <text x="663" y="123" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">ALIM.</text>
  <text x="600" y="142" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">C1 — VCC</text>
  <text x="600" y="157" font-size="11" fill="#444" text-anchor="middle">alimentazione</text>

  <!-- C2 RST -->
  <rect x="545" y="170" width="150" height="56" rx="8" fill="url(#pPower)" stroke="#b5760f" stroke-width="3"/>
  <rect x="637" y="176" width="52" height="15" rx="4" fill="#b5760f"/>
  <text x="663" y="187" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">ALIM.</text>
  <text x="600" y="206" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">C2 — RST</text>
  <text x="600" y="221" font-size="11" fill="#444" text-anchor="middle">reset</text>

  <!-- C3 CLK (dati: pieno blu, bordo blu spesso) -->
  <rect x="545" y="234" width="150" height="56" rx="8" fill="#cfe3f3" stroke="#0072B2" stroke-width="4"/>
  <rect x="637" y="240" width="52" height="15" rx="4" fill="#0072B2"/>
  <text x="663" y="251" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">DATO</text>
  <text x="600" y="270" font-size="16" font-weight="700" fill="#06365e" text-anchor="middle">C3 — CLK</text>
  <text x="600" y="285" font-size="11" fill="#0a4a7a" text-anchor="middle">clock (ritmo bit)</text>

  <!-- C4 (non usato: diagonale) -->
  <rect x="545" y="298" width="150" height="56" rx="8" fill="url(#pUnused)" stroke="#a9a69e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="623" y="304" width="66" height="15" rx="4" fill="#a9a69e"/>
  <text x="656" y="315" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">NON USATO</text>
  <text x="600" y="336" font-size="16" font-weight="700" fill="#6f6d66" text-anchor="middle">C4</text>

  <!-- C5 GND (massa: righe orizz., bordo nero tratteggiato) -->
  <rect x="715" y="106" width="150" height="56" rx="8" fill="url(#pGnd)" stroke="#111" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="807" y="112" width="52" height="15" rx="4" fill="#111"/>
  <text x="833" y="123" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">MASSA</text>
  <text x="770" y="142" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">C5 — GND</text>
  <text x="770" y="157" font-size="11" fill="#444" text-anchor="middle">massa</text>

  <!-- C6 -->
  <rect x="715" y="170" width="150" height="56" rx="8" fill="url(#pUnused)" stroke="#a9a69e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="793" y="176" width="66" height="15" rx="4" fill="#a9a69e"/>
  <text x="826" y="187" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">NON USATO</text>
  <text x="770" y="206" font-size="16" font-weight="700" fill="#6f6d66" text-anchor="middle">C6 — VPP</text>

  <!-- C7 I/O (dati) -->
  <rect x="715" y="234" width="150" height="56" rx="8" fill="#cfe3f3" stroke="#0072B2" stroke-width="4"/>
  <rect x="807" y="240" width="52" height="15" rx="4" fill="#0072B2"/>
  <text x="833" y="251" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">DATO</text>
  <text x="770" y="270" font-size="16" font-weight="700" fill="#06365e" text-anchor="middle">C7 — I/O</text>
  <text x="770" y="285" font-size="11" fill="#0a4a7a" text-anchor="middle">dato</text>

  <!-- C8 -->
  <rect x="715" y="298" width="150" height="56" rx="8" fill="url(#pUnused)" stroke="#a9a69e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="793" y="304" width="66" height="15" rx="4" fill="#a9a69e"/>
  <text x="826" y="315" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">NON USATO</text>
  <text x="770" y="336" font-size="16" font-weight="700" fill="#6f6d66" text-anchor="middle">C8</text>

  <text x="545" y="374" font-size="11" fill="#777">Numerazione: C1 in alto a sinistra, C5 in alto a destra.</text>

  <!-- legenda con motivi -->
  <rect x="545" y="388" width="320" height="168" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="561" y="410" font-size="13" font-weight="700" fill="#1a1a1a">Legenda (colore + motivo + etichetta)</text>

  <rect x="561" y="420" width="22" height="14" rx="3" fill="#cfe3f3" stroke="#0072B2" stroke-width="3"/>
  <text x="592" y="431" font-size="12" fill="#333">DATO (pieno, bordo blu): C3 (CLK), C7 (I/O)</text>

  <rect x="561" y="440" width="22" height="14" rx="3" fill="url(#pGnd)" stroke="#111" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="592" y="451" font-size="12" fill="#333">MASSA (righe, bordo nero): C5 (GND)</text>

  <rect x="561" y="460" width="22" height="14" rx="3" fill="url(#pPower)" stroke="#b5760f" stroke-width="2"/>
  <text x="592" y="471" font-size="12" fill="#333">ALIM. (puntini, bordo arancio): C1, C2</text>

  <rect x="561" y="480" width="22" height="14" rx="3" fill="url(#pUnused)" stroke="#a9a69e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="592" y="491" font-size="12" fill="#333">NON USATO (diagonale, grigio): C4, C6, C8</text>

  <line x1="561" y1="502" x2="849" y2="502" stroke="#e2e2e2" stroke-width="1"/>
  <text x="561" y="520" font-size="11" fill="#555">Lettura/scrittura: il lettore usa C1, C2, C3, C5, C7.</text>
  <text x="561" y="536" font-size="11" fill="#555">Per sniffing colleghi solo: C3 (clock), C7 (dato), C5 (massa).</text>
  <text x="561" y="550" font-size="11" fill="#777">I tre "da collegare" hanno un'etichetta DATO/DATO/MASSA.</text>
</svg>
