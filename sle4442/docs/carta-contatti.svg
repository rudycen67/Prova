<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a1a1a">Smart card SLE4442 — formato, posizione e dimensioni del chip</text>
  <text x="40" y="63" font-size="13" fill="#555">ISO/IEC 7810 ID-1 (carta) · ISO/IEC 7816-2 (posizione/numerazione contatti). Quote in mm.</text>

  <!-- ===== CARTA (sinistra), scala 5 px/mm ===== -->
  <rect x="50" y="110" width="428" height="270" rx="16" fill="#f3f2ef" stroke="#444" stroke-width="2"/>

  <!-- modulo chip, posizione ISO (campo contatti x 101..149, y 206..278) -->
  <rect x="93" y="201" width="64" height="82" rx="7" fill="#d9b84a" stroke="#b89530" stroke-width="1.5"/>
  <line x1="125" y1="203" x2="125" y2="281" stroke="#b89530" stroke-width="1"/>
  <line x1="95" y1="221" x2="155" y2="221" stroke="#b89530" stroke-width="1"/>
  <line x1="95" y1="241" x2="155" y2="241" stroke="#b89530" stroke-width="1"/>
  <line x1="95" y1="261" x2="155" y2="261" stroke="#b89530" stroke-width="1"/>

  <!-- connettore -> dettaglio -->
  <line x1="157" y1="235" x2="520" y2="150" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- quota orizzontale: bordo sinistro -> 1a colonna contatti -->
  <line x1="50" y1="185" x2="101" y2="185" stroke="#c0392b" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="101" y1="185" x2="101" y2="201" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="75" y="179" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="600">10,25</text>

  <!-- quota verticale: bordo superiore -> 1a riga contatti -->
  <line x1="74" y1="110" x2="74" y2="206" stroke="#c0392b" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="74" y1="206" x2="93" y2="206" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="68" y="158" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="600" transform="rotate(-90 68 158)">19,23</text>

  <!-- quota larghezza carta -->
  <line x1="50" y1="398" x2="478" y2="398" stroke="#555" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="264" y="415" font-size="14" fill="#333" text-anchor="middle" font-weight="600">85,60 mm</text>

  <!-- quota altezza carta -->
  <line x1="34" y1="110" x2="34" y2="380" stroke="#555" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="28" y="245" font-size="14" fill="#333" text-anchor="middle" font-weight="600" transform="rotate(-90 28 245)">53,98 mm</text>

  <text x="300" y="128" font-size="11" fill="#777">angoli r 3,18 mm</text>

  <!-- spessore -->
  <rect x="50" y="428" width="428" height="9" rx="3" fill="#e2e0db" stroke="#9a978f" stroke-width="1"/>
  <text x="264" y="453" font-size="12" fill="#555" text-anchor="middle">spessore 0,76 mm (taglio, non in scala)</text>

  <!-- ===== Tabella quote ISO (sinistra, in basso) ===== -->
  <rect x="50" y="470" width="430" height="192" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="66" y="492" font-size="13" font-weight="700" fill="#1a1a1a">Posizione contatti — ISO/IEC 7816-2</text>
  <text x="66" y="514" font-size="12" fill="#333">Area minima di ogni contatto: <tspan font-weight="700">2,0 × 1,7 mm</tspan></text>
  <text x="66" y="536" font-size="12" fill="#333" font-weight="700">Colonne (dal bordo SINISTRO):</text>
  <text x="80" y="554" font-size="12" fill="#333">C1–C4 (sinistra):  da 10,25 a 12,25 mm</text>
  <text x="80" y="571" font-size="12" fill="#333">C5–C8 (destra):    da 17,87 a 19,87 mm</text>
  <text x="66" y="593" font-size="12" fill="#333" font-weight="700">Righe (dal bordo SUPERIORE), bordo alto:</text>
  <text x="80" y="611" font-size="12" fill="#333">C1/C5: 19,23   ·   C2/C6: 23,47</text>
  <text x="80" y="628" font-size="12" fill="#333">C3/C7: 27,71   ·   C4/C8: 31,95   (passo 4,24)</text>
  <text x="66" y="650" font-size="11" fill="#777">Il modulo dorato visibile è ~12–13 mm (non fissato da ISO).</text>

  <!-- ===== DETTAGLIO CONTATTI (destra) ===== -->
  <text x="545" y="96" font-size="14" fill="#333" font-weight="600">Contatti (lato chip verso di te)</text>

  <!-- C1 VCC -->
  <rect x="545" y="106" width="150" height="52" rx="8" fill="#e9d88f" stroke="#b89530" stroke-width="2"/>
  <text x="620" y="130" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">C1 — VCC</text>
  <text x="620" y="148" font-size="12" fill="#555" text-anchor="middle">alimentazione</text>
  <!-- C2 RST -->
  <rect x="545" y="170" width="150" height="52" rx="8" fill="#e9d88f" stroke="#b89530" stroke-width="2"/>
  <text x="620" y="194" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">C2 — RST</text>
  <text x="620" y="212" font-size="12" fill="#555" text-anchor="middle">reset</text>
  <!-- C3 CLK -->
  <rect x="545" y="234" width="150" height="52" rx="8" fill="#cdeedd" stroke="#2e9e5b" stroke-width="3"/>
  <text x="620" y="258" font-size="17" font-weight="700" fill="#15532f" text-anchor="middle">C3 — CLK</text>
  <text x="620" y="276" font-size="12" fill="#1f6b41" text-anchor="middle">clock (ritmo bit)</text>
  <!-- C4 -->
  <rect x="545" y="298" width="150" height="52" rx="8" fill="#eceae5" stroke="#bdbab2" stroke-width="2"/>
  <text x="620" y="322" font-size="17" font-weight="700" fill="#8a8880" text-anchor="middle">C4</text>
  <text x="620" y="340" font-size="12" fill="#8a8880" text-anchor="middle">non usato</text>

  <!-- C5 GND -->
  <rect x="715" y="106" width="150" height="52" rx="8" fill="#d7e3f0" stroke="#5b7a9e" stroke-width="3"/>
  <text x="790" y="130" font-size="17" font-weight="700" fill="#2b4866" text-anchor="middle">C5 — GND</text>
  <text x="790" y="148" font-size="12" fill="#3a5a7d" text-anchor="middle">massa</text>
  <!-- C6 -->
  <rect x="715" y="170" width="150" height="52" rx="8" fill="#eceae5" stroke="#bdbab2" stroke-width="2"/>
  <text x="790" y="194" font-size="17" font-weight="700" fill="#8a8880" text-anchor="middle">C6 — VPP</text>
  <text x="790" y="212" font-size="12" fill="#8a8880" text-anchor="middle">non usato</text>
  <!-- C7 I/O -->
  <rect x="715" y="234" width="150" height="52" rx="8" fill="#cdeedd" stroke="#2e9e5b" stroke-width="3"/>
  <text x="790" y="258" font-size="17" font-weight="700" fill="#15532f" text-anchor="middle">C7 — I/O</text>
  <text x="790" y="276" font-size="12" fill="#1f6b41" text-anchor="middle">dato</text>
  <!-- C8 -->
  <rect x="715" y="298" width="150" height="52" rx="8" fill="#eceae5" stroke="#bdbab2" stroke-width="2"/>
  <text x="790" y="322" font-size="17" font-weight="700" fill="#8a8880" text-anchor="middle">C8</text>
  <text x="790" y="340" font-size="12" fill="#8a8880" text-anchor="middle">non usato</text>

  <text x="545" y="372" font-size="11" fill="#777">Numerazione: C1 in alto a sinistra, C5 in alto a destra.</text>

  <!-- legenda -->
  <rect x="545" y="388" width="320" height="150" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="561" y="411" font-size="13" font-weight="700" fill="#1a1a1a">Protocollo 2-wire della SLE4442</text>
  <rect x="561" y="423" width="16" height="12" rx="2" fill="#cdeedd" stroke="#2e9e5b" stroke-width="2"/>
  <text x="585" y="433" font-size="12" fill="#333">C3 (CLK) e C7 (I/O) = i due fili dati</text>
  <rect x="561" y="443" width="16" height="12" rx="2" fill="#d7e3f0" stroke="#5b7a9e" stroke-width="2"/>
  <text x="585" y="453" font-size="12" fill="#333">C5 (GND) = massa di riferimento</text>
  <rect x="561" y="463" width="16" height="12" rx="2" fill="#e9d88f" stroke="#b89530" stroke-width="2"/>
  <text x="585" y="473" font-size="12" fill="#333">C1 (VCC) e C2 (RST) = alimentazione/avvio</text>
  <rect x="561" y="483" width="16" height="12" rx="2" fill="#eceae5" stroke="#bdbab2" stroke-width="2"/>
  <text x="585" y="493" font-size="12" fill="#333">C4, C6, C8 = non usati</text>
  <text x="561" y="517" font-size="11" fill="#777">Lettura/scrittura: il lettore usa C1,C2,C3,C5,C7.</text>
  <text x="561" y="531" font-size="11" fill="#777">Sniffing: servono solo C3, C7, C5.</text>
</svg>
