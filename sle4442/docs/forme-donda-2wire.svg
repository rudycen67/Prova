<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <text x="30" y="30" font-size="19" font-weight="700" fill="#1a1a1a">Forme d'onda del 2-wire (un byte letto)</text>
  <text x="30" y="51" font-size="12" fill="#555">Il dato su I/O vale quando CLK è alto. I bit si leggono LSB per primo. Esempio: un byte = 0x22.</text>

  <!-- griglia verticale ai confini dei bit -->
  <g stroke="#eee" stroke-width="1">
    <line x1="160" y1="80" x2="160" y2="300"/><line x1="220" y1="80" x2="220" y2="300"/>
    <line x1="280" y1="80" x2="280" y2="300"/><line x1="340" y1="80" x2="340" y2="300"/>
    <line x1="400" y1="80" x2="400" y2="300"/><line x1="460" y1="80" x2="460" y2="300"/>
    <line x1="520" y1="80" x2="520" y2="300"/><line x1="580" y1="80" x2="580" y2="300"/>
    <line x1="640" y1="80" x2="640" y2="300"/>
  </g>

  <!-- etichette tracce -->
  <text x="26" y="130" font-size="14" font-weight="700" fill="#0072B2" text-anchor="end">CLK</text>
  <text x="26" y="250" font-size="14" font-weight="700" fill="#b5760f" text-anchor="end">I/O</text>

  <!-- CLK -->
  <polyline fill="none" stroke="#0072B2" stroke-width="2.5" points="
    80,120 160,120 160,155 190,155 190,120 220,120 220,155 250,155 250,120
    280,120 280,155 310,155 310,120 340,120 340,155 370,155 370,120
    400,120 400,155 430,155 430,120 460,120 460,155 490,155 490,120
    520,120 520,155 550,155 550,120 580,120 580,155 610,155 610,120 720,120"/>

  <!-- I/O -->
  <polyline fill="none" stroke="#b5760f" stroke-width="2.5" points="
    80,240 140,240 140,275 220,275 220,240 280,240 280,275 460,275 460,240
    520,240 520,275 660,275 660,240 720,240"/>

  <!-- START / STOP -->
  <circle cx="140" cy="258" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="140" y="305" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">START</text>
  <text x="140" y="320" font-size="9" fill="#c0392b" text-anchor="middle">I/O scende, CLK alto</text>
  <circle cx="660" cy="258" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="660" y="305" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">STOP</text>
  <text x="660" y="320" font-size="9" fill="#c0392b" text-anchor="middle">I/O sale, CLK alto</text>

  <!-- etichette bit (LSB-first), valori 0x22 = b0..b7: 0 1 0 0 0 1 0 0 -->
  <g font-size="11" text-anchor="middle">
    <text x="190" y="345" fill="#333">b0=0</text>
    <text x="250" y="345" fill="#333">b1=1</text>
    <text x="310" y="345" fill="#333">b2=0</text>
    <text x="370" y="345" fill="#333">b3=0</text>
    <text x="430" y="345" fill="#333">b4=0</text>
    <text x="490" y="345" fill="#333">b5=1</text>
    <text x="550" y="345" fill="#333">b6=0</text>
    <text x="610" y="345" fill="#333">b7=0</text>
  </g>
  <text x="400" y="368" font-size="11" fill="#777" text-anchor="middle">LSB per primo: b0 è il bit meno significativo &#8594; il byte vale 0x22</text>

  <!-- freccia "si legge qui" su un CLK alto -->
  <line x1="250" y1="100" x2="250" y2="118" stroke="#0072B2" stroke-width="1.5"/>
  <text x="250" y="94" font-size="9" fill="#0072B2" text-anchor="middle">si legge il bit (CLK alto)</text>
</svg>
