<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b5760f"/>
    </marker>
    <pattern id="pPower" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fdeccf"/><circle cx="4.5" cy="4.5" r="1.5" fill="#b5760f"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Com'è fatto l'interposer e dov'è lo slot</text>
  <text x="30" y="55" font-size="13" fill="#555">Lo slot non è in foto sul sito: è il connettore FCI 52400 che SALDI tu sulla basetta.</text>

  <!-- LETTORE -->
  <rect x="40" y="170" width="150" height="150" rx="10" fill="#eceae5" stroke="#555" stroke-width="2"/>
  <text x="115" y="235" font-size="14" font-weight="700" fill="#333" text-anchor="middle">Lettore</text>
  <text x="115" y="255" font-size="14" font-weight="700" fill="#333" text-anchor="middle">ACR39U</text>
  <rect x="184" y="222" width="14" height="46" fill="#333"/>
  <text x="150" y="300" font-size="11" fill="#777" text-anchor="middle">fessura</text>

  <!-- SCHEDA INTERPOSER (PCB) -->
  <rect x="178" y="222" width="440" height="46" rx="4" fill="#dfeaf3" stroke="#0072B2" stroke-width="2"/>
  <text x="430" y="300" font-size="13" fill="#0a4a7a" text-anchor="middle" font-weight="600">Scheda interposer (PCB 0,8 mm)</text>
  <text x="250" y="210" font-size="11" fill="#0a4a7a">&#8592; la linguetta entra nel lettore</text>

  <!-- CONNETTORE = SLOT -->
  <rect x="398" y="190" width="95" height="90" rx="5" fill="url(#pPower)" stroke="#b5760f" stroke-width="3"/>
  <text x="445" y="182" font-size="12" font-weight="700" fill="#8a5a0c" text-anchor="middle">SLOT = connettore FCI 52400</text>
  <text x="445" y="238" font-size="11" fill="#6b470a" text-anchor="middle">qui infili</text>
  <text x="445" y="252" font-size="11" fill="#6b470a" text-anchor="middle">la carta</text>

  <!-- CARTA VERA nello slot -->
  <rect x="405" y="70" width="130" height="118" rx="9" fill="#f3f2ef" stroke="#444" stroke-width="2"/>
  <rect x="420" y="95" width="30" height="24" rx="3" fill="#d9b84a" stroke="#8a6d1c" stroke-width="1"/>
  <text x="470" y="112" font-size="12" font-weight="700" fill="#333">la tua</text>
  <text x="470" y="128" font-size="12" font-weight="700" fill="#333">SLE4442</text>
  <line x1="470" y1="150" x2="470" y2="188" stroke="#b5760f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PIN per analizzatore -->
  <rect x="220" y="268" width="12" height="20" fill="#d9b84a" stroke="#8a6d1c"/>
  <rect x="242" y="268" width="12" height="20" fill="#d9b84a" stroke="#8a6d1c"/>
  <rect x="264" y="268" width="12" height="20" fill="#d9b84a" stroke="#8a6d1c"/>
  <text x="248" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="600">pin: CLK · I/O · GND</text>

  <!-- ANALIZZATORE -->
  <rect x="150" y="360" width="200" height="60" rx="8" fill="#eaf3fb" stroke="#0072B2" stroke-width="2"/>
  <text x="250" y="386" font-size="13" font-weight="700" fill="#06365e" text-anchor="middle">Logic analyzer</text>
  <text x="250" y="404" font-size="12" fill="#0a4a7a" text-anchor="middle">+ PulseView (sul PC)</text>
  <line x1="226" y1="288" x2="210" y2="360" stroke="#0072B2" stroke-width="1.6"/>
  <line x1="248" y1="288" x2="250" y2="360" stroke="#0072B2" stroke-width="1.6"/>
  <line x1="270" y1="288" x2="290" y2="360" stroke="#0072B2" stroke-width="1.6"/>

  <!-- note -->
  <rect x="560" y="330" width="280" height="118" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="576" y="352" font-size="12" font-weight="700" fill="#1a1a1a">In parole:</text>
  <text x="576" y="372" font-size="12" fill="#333">1. La linguetta della PCB entra nel lettore.</text>
  <text x="576" y="390" font-size="12" fill="#333">2. La tua carta entra nello SLOT (il connettore</text>
  <text x="592" y="406" font-size="12" fill="#333">FCI 52400 che hai saldato).</text>
  <text x="576" y="424" font-size="12" fill="#333">3. L'analizzatore si collega ai pin e ascolta.</text>
  <text x="576" y="442" font-size="11" fill="#777">La basetta nuda (dal sito) non ha ancora lo slot.</text>
</svg>
