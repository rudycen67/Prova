# Sostituire NOME_ANDROID con il nome del telefono Android (dopo "notify.mobile_app_").
# Il gruppo notify.telefoni_antifurto e' definito in configuration.yaml.

- id: antifurto_sirena_allarme
  alias: "Antifurto: SIRENA sui telefoni quando scatta l'allarme"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.antifurto_allarme_in_corso
      to: "on"
  action:
    # Ripete l'avviso ogni 30 secondi finche' l'allarme suona (max 10 volte).
    - repeat:
        while:
          - condition: state
            entity_id: binary_sensor.antifurto_allarme_in_corso
            state: "on"
          - condition: template
            value_template: "{{ repeat.index <= 10 }}"
        sequence:
          # Notifica CRITICA su tutti i telefoni: suona anche in silenzioso / non disturbare
          - action: notify.telefoni_antifurto
            data:
              title: "🚨 ALLARME IN CASA"
              message: "L'antifurto sta suonando ({{ now().strftime('%H:%M:%S') }})"
              data:
                tag: antifurto_allarme
                # --- Android ---
                ttl: 0
                priority: high
                channel: alarm_stream
                importance: high
                persistent: true
                sticky: true
                color: "#ff0000"
                notification_icon: mdi:alarm-light
                vibrationPattern: "200, 800, 200, 800, 200, 800, 200, 800"
                ledColor: red
                # --- iPhone ---
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
                  interruption-level: critical
                # --- pulsanti nella notifica ---
                actions:
                  - action: "DISINSERISCI_ANTIFURTO"
                    title: "Disinserisci"
                    destructive: true
                  - action: "URI"
                    title: "Apri"
                    uri: "/dashboard-antifurto/0"
          # Android: voce ad alto volume sul canale "sveglia", anche con telefono in silenzioso
          - action: notify.mobile_app_NOME_ANDROID
            data:
              message: TTS
              data:
                tts_text: "Allarme! L'antifurto di casa sta suonando!"
                media_stream: alarm_stream_max
          - delay: { seconds: 30 }

- id: antifurto_allarme_terminato
  alias: "Antifurto: avviso allarme terminato"
  trigger:
    - platform: state
      entity_id: binary_sensor.antifurto_allarme_in_corso
      from: "on"
      to: "off"
  action:
    - action: notify.telefoni_antifurto
      data:
        title: "Antifurto"
        message: "Allarme terminato ({{ now().strftime('%H:%M') }})"
        data:
          tag: antifurto_allarme

- id: antifurto_azione_disinserisci
  alias: "Antifurto: disinserisci dal pulsante della notifica"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: "DISINSERISCI_ANTIFURTO"
  action:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.antifurto

- id: antifurto_notifica_stato
  alias: "Antifurto: notifica inserito / disinserito"
  trigger:
    - platform: state
      entity_id: binary_sensor.antifurto_inserito
      from: "off"
      to: "on"
      id: inserito
    - platform: state
      entity_id: binary_sensor.antifurto_inserito
      from: "on"
      to: "off"
      id: disinserito
  action:
    - action: notify.telefoni_antifurto
      data:
        title: "Antifurto"
        message: >-
          {% if trigger.id == 'inserito' %}Impianto INSERITO{% else %}Impianto disinserito{% endif %}
          ({{ now().strftime('%H:%M') }})
        data:
          tag: antifurto_stato

- id: antifurto_riavvia_ponte_se_bloccato
  alias: "Antifurto: riavvia il ponte se il Marss non risponde"
  trigger:
    - platform: state
      entity_id: binary_sensor.antifurto_inserito
      to: "unavailable"
      for: { minutes: 3 }
  action:
    - action: script.antifurto_riavvia_ponte
