# =============================================================================
# Antifurto Bentel KYO 32 + modulo Marss IP Controller in Home Assistant
# tramite l'add-on "Bentel Socat Bridge" (nome interno 92d7005e-bentel-socat).
#
# Collegamenti sul campo (verificati):
#   - Marss IN1  <- KYO morsetto 23 (O1), programmato "inserimento": in1 = impianto inserito
#   - Marss IN2  <- contatto di un modulo rele' 12 V la cui bobina sta tra la vite NO
#                   del rele' di allarme della KYO e un morsetto -: in2 = allarme in corso
#   - Marss Relay 1 (C + NO) -> i due fili della zona "chiave" della KYO: impulso 2 s
#                   (temporizzazione impostata nel Marss, Output Configuration)
#
# BLOCCO A: da incollare in fondo a configuration.yaml (sostituisce il blocco
#           precedente "rest:" / "rest_command:").
# BLOCCO B: da incollare in scripts.yaml.
# BLOCCO C: da incollare in automations.yaml (sostituire NOME_TELEFONO).
# =============================================================================

# ----------------------------- BLOCCO A --------------------------------------
rest:
  - resource: http://92d7005e-bentel-socat:26501/protect/status.xml
    method: GET
    authentication: basic
    username: admin
    password: marss
    scan_interval: 5
    timeout: 60
    binary_sensor:
      - name: "Antifurto inserito"
        unique_id: marss_ipc_inserito
        icon: mdi:shield-lock
        value_template: "{{ value_json.response.ledi1 | int == 2 }}"
      - name: "Antifurto allarme in corso"
        unique_id: marss_ipc_allarme
        device_class: safety
        value_template: "{{ value_json.response.ledi2 | int == 2 }}"
      - name: "Antifurto ingresso 3"
        unique_id: marss_ipc_in3
        value_template: "{{ value_json.response.ledi3 | int == 2 }}"
      - name: "Antifurto ingresso 4"
        unique_id: marss_ipc_in4
        value_template: "{{ value_json.response.ledi4 | int == 2 }}"
      - name: "Antifurto modulo tamper"
        unique_id: marss_ipc_tamper
        device_class: tamper
        value_template: "{{ value_json.response.msgTampCh0 | int == 1 }}"
    sensor:
      - name: "Antifurto modulo codice richiesto"
        unique_id: marss_ipc_ver_pass
        value_template: "{{ value_json.response.ver_pass }}"

rest_command:
  marss_premi_uscita:
    url: "http://92d7005e-bentel-socat:26501/protect/buttons.cgi?button={{ uscita }}"
    method: GET
    username: admin
    password: marss
    timeout: 60
  marss_invia_codice:
    url: "http://92d7005e-bentel-socat:26501/protect/index.htm"
    method: POST
    username: admin
    password: marss
    content_type: "application/x-www-form-urlencoded"
    payload: "password=123456"
    timeout: 60

# Pannello allarme vero e proprio: stato letto dal Marss, comando tramite
# il Relay 1 (zona chiave). Nessun codice richiesto nell'app.
alarm_control_panel:
  - platform: template
    panels:
      antifurto:
        name: "Antifurto"
        unique_id: marss_antifurto_pannello
        code_arm_required: false
        value_template: >-
          {% if is_state('binary_sensor.antifurto_allarme_in_corso', 'on') %}triggered
          {% elif is_state('binary_sensor.antifurto_inserito', 'on') %}armed_away
          {% else %}disarmed{% endif %}
        arm_away:
          - condition: state
            entity_id: binary_sensor.antifurto_inserito
            state: "off"
          - action: script.antifurto_premi_uscita_1
        disarm:
          - condition: state
            entity_id: binary_sensor.antifurto_inserito
            state: "on"
          - action: script.antifurto_premi_uscita_1

