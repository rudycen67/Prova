<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" aria-label="Confronto delle aperture: f/1.4 al cento per cento, f/1.9 al cinquantaquattro, f/2.4 al trentaquattro, f/2.9 al ventitre per cento della luce raccolta"><title>Confronto delle aperture: f/1.4 al cento per cento, f/1.9 al cinquantaquattro, f/2.4 al trentaquattro, f/2.9 al ventitre per cento della luce raccolta</title><rect x="0" y="0" width="700" height="230" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><circle cx="102" cy="104" r="46" fill="none" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="102" cy="104" r="44.0" fill="#0c7a84" stroke="#0c7a84" stroke-width="1.4"/><text x="102" y="44" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#0c7a84" text-anchor="middle">f/1.4</text><text x="102" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d2427" text-anchor="middle">Principale</text><text x="102" y="189" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">100% della luce</text><circle cx="274" cy="104" r="46" fill="none" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="274" cy="104" r="32.3" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4"/><text x="274" y="44" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#1d2427" text-anchor="middle">f/1.9</text><text x="274" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d2427" text-anchor="middle">Ultra-grand.</text><text x="274" y="189" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">54% della luce</text><circle cx="446" cy="104" r="46" fill="none" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="446" cy="104" r="25.7" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4"/><text x="446" y="44" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#1d2427" text-anchor="middle">f/2.4</text><text x="446" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d2427" text-anchor="middle">Tele 3x</text><text x="446" y="189" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">34% della luce</text><circle cx="618" cy="104" r="46" fill="none" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="618" cy="104" r="21.1" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4"/><text x="618" y="44" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#1d2427" text-anchor="middle">f/2.9</text><text x="618" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d2427" text-anchor="middle">Tele 5x</text><text x="618" y="189" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">23% della luce</text><text x="24" y="24" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.13em">LUCE RACCOLTA, RISPETTO AL PRINCIPALE</text><rect x="24" y="204" width="652" height="20" rx="5" fill="#e6eaec"/><text x="38" y="218" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1d2427" text-anchor="start">Sul telefono l'apertura è FISSA: in modalità Pro regoli solo ISO e tempo di posa.</text></svg>