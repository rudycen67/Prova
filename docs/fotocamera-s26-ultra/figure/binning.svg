<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="Schema del pixel binning: griglia di sedici fotositi da 0,6 micron che si fondono in un pixel da 2,4 micron, con le tre risoluzioni risultanti"><title>Schema del pixel binning: griglia di sedici fotositi da 0,6 micron che si fondono in un pixel da 2,4 micron, con le tre risoluzioni risultanti</title><rect x="0" y="0" width="780" height="250" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><rect x="40" y="62" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="62" y="62" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="84" y="62" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="106" y="62" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="40" y="84" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="62" y="84" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="84" y="84" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="106" y="84" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="40" y="106" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="62" y="106" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="84" y="106" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="106" y="106" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="40" y="128" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="62" y="128" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="84" y="128" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="106" y="128" width="20" height="20" rx="2" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1"/><rect x="38" y="60" width="92" height="92" rx="4" fill="none" stroke="#0c7a84" stroke-width="2"/><text x="84" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">16 fotositi · 0.6 µm</text><line x1="146" y1="106" x2="192" y2="106" stroke="#0c7a84" stroke-width="1.8" marker-end="url(#ar)"/><text x="169" y="98" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#0c7a84" text-anchor="middle">somma</text><rect x="206" y="60" width="92" height="92" rx="4" fill="#d7ebed" stroke="#0c7a84" stroke-width="2"/><text x="252" y="112" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#0c7a84" text-anchor="middle">2.4 µm</text><text x="252" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">1 pixel virtuale</text><rect x="336" y="62" width="424" height="26" rx="5" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.2"/><text x="350" y="79.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">4×4</text><text x="392" y="79.5" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0c7a84" text-anchor="start">12.5 MP</text><text x="454" y="79.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">2.4 µm</text><text x="512" y="79.5" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">il default — massima elaborazione</text><rect x="336" y="94" width="424" height="26" rx="5" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><text x="350" y="111.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">2×2</text><text x="392" y="111.5" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#1d2427" text-anchor="start">50 MP</text><text x="454" y="111.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">1.2 µm</text><text x="512" y="111.5" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">buona luce, margine di ritaglio</text><rect x="336" y="126" width="424" height="26" rx="5" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><text x="350" y="143.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">—</text><text x="392" y="143.5" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#1d2427" text-anchor="start">200 MP</text><text x="454" y="143.5" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">0.6 µm</text><text x="512" y="143.5" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">solo piena luce, soggetto fermo</text><rect x="38" y="186" width="722" height="44" rx="7" fill="#e6eaec"/><text x="56" y="206" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2427" text-anchor="start">Più pixel non significa più dettaglio.</text><text x="56" y="222" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">A 12 MP il telefono fonde una decina di scatti; a 200 MP quasi nulla. In interni il 12 MP vince.</text></svg>