<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Scala dello zoom da 0,6x a oltre 30x divisa in tre categorie: ottico, ritaglio dal sensore e ricostruzione digitale, con il 2x e il 10x indicati come ritagli a qualita piena"><title>Scala dello zoom da 0,6x a oltre 30x divisa in tre categorie: ottico, ritaglio dal sensore e ricostruzione digitale, con il 2x e il 10x indicati come ritagli a qualita piena</title><rect x="0" y="0" width="720" height="260" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><rect x="18" y="64" width="76" height="66" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="56" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#0c7a84" text-anchor="middle">0.6x</text><text x="56" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ottico</text><text x="56" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">ultra-grand.</text><rect x="106" y="64" width="76" height="66" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="144" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#0c7a84" text-anchor="middle">1x</text><text x="144" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ottico</text><text x="144" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">principale</text><rect x="194" y="64" width="76" height="66" rx="8" fill="none" stroke="#9e580c" stroke-width="1.6"/><text x="232" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#9e580c" text-anchor="middle">2x</text><text x="232" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ritaglio</text><text x="232" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">dal 200 MP</text><rect x="282" y="64" width="76" height="66" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="320" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#0c7a84" text-anchor="middle">3x</text><text x="320" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ottico</text><text x="320" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">tele 10 MP</text><rect x="370" y="64" width="76" height="66" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="408" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#0c7a84" text-anchor="middle">5x</text><text x="408" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ottico</text><text x="408" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">periscopio</text><rect x="458" y="64" width="76" height="66" rx="8" fill="none" stroke="#9e580c" stroke-width="1.6"/><text x="496" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#9e580c" text-anchor="middle">10x</text><text x="496" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ritaglio</text><text x="496" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">dal 50 MP</text><rect x="546" y="64" width="76" height="66" rx="8" fill="none" stroke="#c3cbcf" stroke-width="1.6"/><text x="584" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#5c686d" text-anchor="middle">30x</text><text x="584" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">digitale</text><text x="584" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">limite d'uso</text><rect x="634" y="64" width="76" height="66" rx="8" fill="#e6eaec" stroke="#c3cbcf" stroke-width="1.6"/><text x="672" y="92" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#5c686d" text-anchor="middle">oltre</text><text x="672" y="108" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#5c686d" text-anchor="middle">ricostruito</text><text x="672" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c686d" text-anchor="middle">per leggere</text><line x1="18" y1="146" x2="534" y2="146" stroke="#0c7a84" stroke-width="2"/><text x="276" y="164" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0c7a84" text-anchor="middle">i cinque gradini che contano:  0.6x · 1x · 2x · 5x · 10x</text><line x1="546" y1="146" x2="710" y2="146" stroke="#c3cbcf" stroke-width="2" stroke-dasharray="4 4"/><text x="628" y="164" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="middle">strumento di lettura</text><text x="18" y="44" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.08em">VERDE = OTTICO   ·   GIALLO = RITAGLIO PULITO DAL SENSORE   ·   GRIGIO = RICOSTRUITO</text><rect x="18" y="188" width="684" height="54" rx="7" fill="#e6eaec"/><text x="36" y="208" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2427" text-anchor="start">Il 2x e il 10x sono quasi gratis.</text><text x="36" y="226" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">Sono ritagli dal centro di un sensore da 200 e da 50 MP: restano 12 MP pieni, stessa ottica, stessa luce.</text></svg>