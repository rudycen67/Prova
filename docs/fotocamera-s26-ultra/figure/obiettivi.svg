<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Confronto dei quattro obiettivi posteriori: ultra-grandangolo 13mm f/1.9, principale 23mm f/1.4, tele 70mm f/2.4 e tele 115mm f/2.9, con la luce raccolta in proporzione"><title>Confronto dei quattro obiettivi posteriori: ultra-grandangolo 13mm f/1.9, principale 23mm f/1.4, tele 70mm f/2.4 e tele 115mm f/2.9, con la luce raccolta in proporzione</title><rect x="0" y="0" width="720" height="300" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><circle cx="106" cy="118" r="40" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><circle cx="106" cy="118" r="27.0" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4" opacity="0.9"/><text x="106" y="44" font-family="ui-monospace, monospace" font-size="17" font-weight="600" fill="#1d2427" text-anchor="middle">0.6x</text><text x="106" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="middle">Ultra-grand.</text><text x="106" y="182" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle">~13 mm</text><text x="106" y="199" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">f/1.9 · 50 MP</text><circle cx="278" cy="118" r="40" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><circle cx="278" cy="118" r="37.0" fill="#0c7a84" stroke="#0c7a84" stroke-width="1.4" opacity="1"/><text x="278" y="44" font-family="ui-monospace, monospace" font-size="17" font-weight="600" fill="#0c7a84" text-anchor="middle">1x</text><text x="278" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="middle">Principale</text><text x="278" y="182" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle">~23 mm</text><text x="278" y="199" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">f/1.4 · 200 MP</text><rect x="232" y="208" width="92" height="20" rx="10" fill="#d7ebed"/><text x="278" y="222" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0c7a84" text-anchor="middle">il default</text><circle cx="450" cy="118" r="40" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><circle cx="450" cy="118" r="21.5" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4" opacity="0.9"/><text x="450" y="44" font-family="ui-monospace, monospace" font-size="17" font-weight="600" fill="#1d2427" text-anchor="middle">3x</text><text x="450" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="middle">Tele</text><text x="450" y="182" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle">~70 mm</text><text x="450" y="199" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">f/2.4 · 10 MP</text><circle cx="622" cy="118" r="40" fill="none" stroke="#c3cbcf" stroke-width="1.2"/><circle cx="622" cy="118" r="18.0" fill="#e6eaec" stroke="#5c686d" stroke-width="1.4" opacity="0.9"/><text x="622" y="44" font-family="ui-monospace, monospace" font-size="17" font-weight="600" fill="#1d2427" text-anchor="middle">5x</text><text x="622" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="middle">Tele periscopico</text><text x="622" y="182" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle">~115 mm</text><text x="622" y="199" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">f/2.9 · 50 MP</text><text x="20" y="24" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.13em">AREA DEL CERCHIO = LUCE RACCOLTA, IN PROPORZIONE</text><rect x="20" y="246" width="680" height="38" rx="7" fill="#e6eaec"/><text x="36" y="262" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2427" text-anchor="start">Persone da vicino → 2x o 3x.   Lontano → 5x.   Primo piano forte → 0.6x.   In tutti gli altri casi → 1x.</text><text x="36" y="277" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">La macro la esegue l'ultra-grandangolo, non un obiettivo dedicato: spesso il 5x da 60 cm rende meglio.</text></svg>