<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Schema dei tre livelli di stabilizzazione con il ritaglio crescente del campo inquadrato, e schema di Horizon Lock che mantiene l'orizzonte dritto mentre il telefono ruota"><title>Schema dei tre livelli di stabilizzazione con il ritaglio crescente del campo inquadrato, e schema di Horizon Lock che mantiene l'orizzonte dritto mentre il telefono ruota</title><rect x="0" y="0" width="720" height="300" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><rect x="22" y="56" width="140" height="96" rx="4" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="22.0" y="56.0" width="140" height="96.0" rx="3" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.8"/><text x="22" y="40" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0c7a84" text-anchor="start">OIS</text><text x="22" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">ottica</text><text x="22" y="186" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#0c7a84" text-anchor="start">nessun ritaglio</text><rect x="192" y="56" width="140" height="96" rx="4" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="197.0" y="59.333333333333336" width="130" height="89.33333333333333" rx="3" fill="#e6eaec" stroke="#5c686d" stroke-width="1.8"/><text x="192" y="40" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#5c686d" text-anchor="start">VDIS</text><text x="192" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">digitale</text><text x="192" y="186" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">ritaglio minimo</text><rect x="362" y="56" width="140" height="96" rx="4" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="377.0" y="66.0" width="110" height="76.0" rx="3" fill="#e6eaec" stroke="#9e580c" stroke-width="1.8"/><text x="362" y="40" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#9e580c" text-anchor="start">Super Steady</text><text x="362" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">digitale spinta</text><text x="362" y="186" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#9e580c" text-anchor="start">ritaglio forte</text><text x="22" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.08em">TRATTEGGIO = CAMPO CATTURATO   ·   PIENO = CAMPO CHE RESTA NEL VIDEO</text><line x1="514" y1="30" x2="514" y2="226" stroke="#c3cbcf" stroke-width="1"/><text x="534" y="40" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0c7a84" text-anchor="start">Horizon Lock</text><g transform="rotate(-22 612 110)"><rect x="556" y="56" width="112" height="108" rx="8" fill="none" stroke="#5c686d" stroke-width="1.6" stroke-dasharray="4 3"/></g><rect x="566" y="74" width="92" height="72" rx="4" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.8"/><line x1="566" y1="120" x2="658" y2="120" stroke="#0c7a84" stroke-width="2"/><text x="612" y="114" font-family="ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#0c7a84" text-anchor="middle">orizzonte</text><text x="534" y="204" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">il telefono ruota,</text><text x="534" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">l'inquadratura no</text><rect x="22" y="236" width="676" height="52" rx="7" fill="#e6eaec"/><text x="40" y="256" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2427" text-anchor="start">Super Steady costa qualità: meno sensore, più elaborazione.</text><text x="40" y="274" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">Accendilo quando ti muovi davvero. Spegnilo su treppiede e al buio, dove il ritaglio peggiora il rumore.</text></svg>