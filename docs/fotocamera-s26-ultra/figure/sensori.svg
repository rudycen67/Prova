<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-label="Rettangoli in scala che confrontano le superfici dei sensori: full frame di riferimento, principale un terzo di pollice virgola tre, ultra-grandangolo, tele 5x, tele 3x"><title>Rettangoli in scala che confrontano le superfici dei sensori: full frame di riferimento, principale un terzo di pollice virgola tre, ultra-grandangolo, tele 5x, tele 3x</title><rect x="0" y="0" width="700" height="290" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><rect x="26" y="60.0" width="260.0" height="173.3" fill="none" stroke="#c3cbcf" stroke-width="1.3"/><rect x="26" y="181.33333333333334" width="69.3" height="52.0" fill="#d7ebed" stroke="#0c7a84" stroke-width="2"/><rect x="26" y="202.35000000000002" width="41.6" height="31.0" fill="none" stroke="#5c686d" stroke-width="1.3"/><rect x="26" y="202.42222222222222" width="41.2" height="30.9" fill="none" stroke="#5c686d" stroke-width="1.3"/><rect x="26" y="213.54444444444445" width="26.4" height="19.8" fill="none" stroke="#5c686d" stroke-width="1.3"/><text x="26" y="44" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.13em">SUPERFICI IN SCALA REALE FRA LORO</text><rect x="330" y="71" width="12" height="12" rx="2" fill="none" stroke="#c3cbcf" stroke-width="1.3"/><text x="352" y="80" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2427" text-anchor="start">Full frame</text><text x="460" y="80" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">(riferimento: una reflex)</text><rect x="330" y="97" width="12" height="12" rx="2" fill="#d7ebed" stroke="#0c7a84" stroke-width="2"/><text x="352" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0c7a84" text-anchor="start">Principale</text><text x="460" y="106" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">1/1.3"  ·  200 MP</text><rect x="330" y="123" width="12" height="12" rx="2" fill="none" stroke="#5c686d" stroke-width="1.3"/><text x="352" y="132" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2427" text-anchor="start">Ultra-grand.</text><text x="460" y="132" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">1/2.5"  ·  50 MP</text><rect x="330" y="149" width="12" height="12" rx="2" fill="none" stroke="#5c686d" stroke-width="1.3"/><text x="352" y="158" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2427" text-anchor="start">Tele 5x</text><text x="460" y="158" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">1/2.52"  ·  50 MP</text><rect x="330" y="175" width="12" height="12" rx="2" fill="none" stroke="#5c686d" stroke-width="1.3"/><text x="352" y="184" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2427" text-anchor="start">Tele 3x</text><text x="460" y="184" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">1/3.94"  ·  10 MP</text><rect x="330" y="212" width="348" height="56" rx="7" fill="#e6eaec"/><text x="346" y="232" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d2427" text-anchor="start">Il principale è ~4× il tele 5x</text><text x="346" y="250" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">e ~9× il tele 3x. Ma è ancora ~15 volte</text><text x="346" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="start">più piccolo di un full frame.</text></svg>