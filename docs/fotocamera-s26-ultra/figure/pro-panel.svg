<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-label="Schema della barra di controlli della modalita Pro con ISO, tempo di posa, compensazione esposizione, fuoco manuale e bilanciamento del bianco, e l'ordine in cui impostarli"><title>Schema della barra di controlli della modalita Pro con ISO, tempo di posa, compensazione esposizione, fuoco manuale e bilanciamento del bianco, e l'ordine in cui impostarli</title><rect x="0" y="0" width="720" height="296" fill="#fdfdfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#0c7a84"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#1d2427"/></marker></defs><rect x="20" y="60" width="124" height="72" rx="8" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2"/><text x="82" y="82" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle" letter-spacing="0.06em">ISO</text><text x="82" y="100" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="middle">50 – 3200</text><text x="82" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">sensibilità</text><circle cx="132" cy="70" r="11" fill="#c3cbcf"/><text x="132" y="74" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#5c686d" text-anchor="middle">3°</text><rect x="158" y="60" width="124" height="72" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="220" y="82" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0c7a84" text-anchor="middle" letter-spacing="0.06em">SPEED</text><text x="220" y="100" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="middle">1/12000 – 30s</text><text x="220" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">tempo di posa</text><circle cx="270" cy="70" r="11" fill="#0c7a84"/><text x="270" y="74" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#f7f9f9" text-anchor="middle">1°</text><rect x="296" y="60" width="124" height="72" rx="8" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2"/><text x="358" y="82" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle" letter-spacing="0.06em">EV</text><text x="358" y="100" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="middle">−2.0 / +2.0</text><text x="358" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">compensazione</text><circle cx="408" cy="70" r="11" fill="#c3cbcf"/><text x="408" y="74" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#5c686d" text-anchor="middle">4°</text><rect x="434" y="60" width="124" height="72" rx="8" fill="#f7f9f9" stroke="#c3cbcf" stroke-width="1.2"/><text x="496" y="82" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#1d2427" text-anchor="middle" letter-spacing="0.06em">FOCUS</text><text x="496" y="100" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="middle">🌷 —— ⛰</text><text x="496" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">fuoco manuale</text><rect x="572" y="60" width="124" height="72" rx="8" fill="#d7ebed" stroke="#0c7a84" stroke-width="1.6"/><text x="634" y="82" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0c7a84" text-anchor="middle" letter-spacing="0.06em">WB</text><text x="634" y="100" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="middle">2300 – 10000 K</text><text x="634" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#5c686d" text-anchor="middle">temperatura</text><circle cx="684" cy="70" r="11" fill="#0c7a84"/><text x="684" y="74" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#f7f9f9" text-anchor="middle">2°</text><text x="20" y="40" font-family="ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#5c686d" text-anchor="start" letter-spacing="0.15em">BARRA DELLA MODALITÀ PRO</text><line x1="20" y1="48" x2="700" y2="48" stroke="#c3cbcf" stroke-width="1"/><rect x="20" y="158" width="680" height="118" rx="8" fill="#e6eaec"/><text x="38" y="182" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2427" text-anchor="start">L'ordine giusto</text><text x="38" y="204" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">1. Scegli il TEMPO che congela (o muove) il soggetto</text><text x="38" y="224" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">2. Fissa il WB in Kelvin: l'automatico slitta fra uno scatto e l'altro</text><text x="38" y="244" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">3. Alza l'ISO solo quanto basta per esporre con quel tempo</text><text x="38" y="264" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5c686d" text-anchor="start">4. Rifinisci con EV guardando l'istogramma</text></svg>