name: Bentel Socat Bridge
version: "2.0.1"
slug: bentel_socat
description: Ponte socat verso il modulo IP dell'antifurto (Marss IP Controller / Bentel), con supporto SSLv3
url: https://github.com/rudycen67/Prova/blob/main/docs/home-assistant-bentel-socat.md
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
# Le immagini base di Home Assistant hanno gia' un proprio init (s6-overlay v3):
# con init:true il container non parte.
init: false
ports:
  26501/tcp: 26501
ports_description:
  26501/tcp: Porta su cui Home Assistant espone il ponte (HTTP semplice in modalita' ssl3/tls)
options:
  bentel_host: 192.168.1.249
  bentel_port: 443
  tls_mode: ssl3
  verbose: true
schema:
  bentel_host: str
  bentel_port: port
  tls_mode: list(ssl3|tls1|tls_auto|none)
  verbose: bool
