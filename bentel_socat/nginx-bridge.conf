# Generato da run.sh: __HOST__ e __PORT__ vengono sostituiti all'avvio.
daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    # Verso socat (che apre la connessione SSLv3 col modulo): una connessione
    # nuova e breve per ogni richiesta, cosi' max-children=1 di socat
    # serializza senza bloccare il browser.
    upstream marss_bridge {
        server 127.0.0.1:26502;
    }

    server {
        listen 26501;
        server_name _;

        location / {
            proxy_pass http://marss_bridge;
            proxy_http_version 1.0;
            proxy_set_header Connection "close";
            proxy_set_header Host "__HOST__";
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 90s;
            proxy_send_timeout    90s;
            proxy_read_timeout    90s;
            proxy_buffering on;

            # Riporta attraverso il ponte eventuali link assoluti del modulo.
            sub_filter_once off;
            sub_filter_types *;
            sub_filter 'https://__HOST__:__PORT__' 'http://$http_host';
            sub_filter 'https://__HOST__' 'http://$http_host';
            sub_filter 'http://__HOST__' 'http://$http_host';
        }
    }
}
