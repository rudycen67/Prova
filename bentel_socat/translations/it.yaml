configuration:
  bentel_host:
    name: Indirizzo IP della centrale Bentel
    description: IP locale della centrale Bentel Kyo (es. 192.168.1.249).
  bentel_port:
    name: Porta della centrale Bentel
    description: Porta TCP su cui risponde la centrale (di norma 26501).
  verbose:
    name: Log dettagliato
    description: Scrive nel log ogni connessione aperta e chiusa dal proxy.
network:
  26501/tcp: Porta locale del proxy (a cui si collega l'integrazione in Home Assistant).
